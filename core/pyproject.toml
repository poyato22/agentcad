[project]
name = "mises"
version = "0.1.0"
description = "Mises harness core"
requires-python = ">=3.13"
dependencies = [
  "pydantic>=2.12", "anthropic>=2.3", "openai>=3.37", "mcp>=2.3",
  "agent-client-protocol>=0.12", "build123d>=0.13", "httpx>=0.28", "httpx2>=2.16",
  "fastapi", "uvicorn", "rich", "prompt_toolkit", "pyyaml", "websockets>=17.3",
  "pillow>=11",  # sketch photos: validate, orient, downscale, re-encode as PNG
  "gmsh>=4.15",  # sim mesher (GPL): only ever imported in a child process, see mises.sim.mesh
  "bd-warehouse>=0.4.0",  # catalog fastener and bearing geometry (Apache-2.0), see mises.catalog.geometry
  "numpy>=2.0",  # study post-processing and the built-in wind (lattice-Boltzmann) solver
]

[project.scripts]
mises = "mises.cli.main:main"

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "pytest-timeout"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mises"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
timeout = 30
testpaths = ["tests"]
markers = ["slow: spawns real sandboxed build subprocesses",
           "cfd_slow: minutes-long CFD validation runs; excluded unless -m cfd_slow or MISES_CFD_SLOW=1",
           "fem_slow: minutes-long nonlinear FEM benchmarks; excluded unless -m fem_slow or MISES_FEM_SLOW=1"]
